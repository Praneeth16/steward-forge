bundle:
  name: steward-forge

include:
  - resources/*.yml

variables:
  app_name:
    description: Workspace-unique name for the Steward Forge workbench App.
    default: steward-forge
  app_user_group_name:
    description: Existing workspace group allowed to open the workbench.
    default: users
  submitter_group_name:
    description: Existing group mapped to the submitter role.
    default: users
  viewer_group_name:
    description: Existing group mapped to the viewer role.
    default: users
  approver_group_name:
    description: Existing group mapped to the named approver role.
    default: users
  operator_group_name:
    description: Existing group mapped to recovery operations.
    default: account admins
  auditor_group_name:
    description: Existing group mapped to evidence and trace review.
    default: account admins
  lakebase_project_id:
    description: Dedicated Autoscaling Lakebase project ID.
    default: steward-forge-lakebase
  lakebase_database:
    description: Logical Postgres database for the Steward Forge ledger.
    default: steward_forge
  lakebase_owner_role_id:
    description: Owner role ID auto-created for the deploying user on the Lakebase production branch.
  catalog_name:
    description: Existing writable Unity Catalog catalog where Steward Forge creates dedicated schemas.
  lakebase_min_cu:
    description: Minimum Autoscaling Lakebase compute units.
    default: 0.5
  lakebase_max_cu:
    description: Maximum Autoscaling Lakebase compute units.
    default: 2

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
